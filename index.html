const SEANCES_M1=[{id:"A",jour:"LUNDI",titre:"Haut du corps — Poussée",focus:"Pectoraux · Épaules · Triceps",couleur:"#1a3a5c",light:"#e8f0fa",warmup:["Rotations d'épaules × 15 (chaque sens)","Cercles de bras croisés × 10","Pompes genoux lentes × 10","Mobilisation thoracique chat-vache × 10"],exercices:[{nom:"Pompes classiques",materiel:"Sol / poignées de pompe",muscles:"Pectoraux, triceps, avant épaules",posture:"Corps aligné tête-talons, abdos gainés, coudes à 45° du corps. Descendre la poitrine à 2-3 cm du sol lentement (3 sec), pousser en explosif. Ton niveau : 25 pompes → viser 4×10-12 propres.",series:4,reps:"10-12",repos:"90s"},{nom:"Dips à la barre",materiel:"Barre dips Eric Flag",muscles:"Triceps, bas pectoraux, épaules",posture:"Mains sur les barres, corps légèrement incliné vers l'avant (15°). Descendre jusqu'à 90° aux coudes, pas plus. Contrôler la descente 3 sec.",series:3,reps:"6-8",repos:"90s"},{nom:"Développé épaules élastique",materiel:"Élastique Eric Flag rouge/noir (5-16 kg)",muscles:"Deltoïdes, trapèzes, triceps",posture:"Debout, un pied sur l'élastique, poignées à hauteur des épaules. Pousser verticalement sans cambrer le bas du dos. Core engagé.",series:3,reps:"10-12",repos:"75s"},{nom:"Pompes pike",materiel:"Sol",muscles:"Deltoïdes antérieurs, triceps",posture:"Position en V inversé, hanches hautes, mains à largeur d'épaules. Descendre la tête vers le sol entre les mains en contrôlant (2 sec).",series:3,reps:"10",repos:"75s"},{nom:"Élévations latérales haltères",materiel:"2 haltères 10 kg",muscles:"Deltoïdes latéraux",posture:"Debout, légère flexion des coudes. Monter les bras à l'horizontale, contrôler la descente 3 sec. Ne pas hausser les épaules.",series:3,reps:"12",repos:"60s"}]},{id:"B",jour:"MARDI",titre:"Bas du corps + Core",focus:"Quadriceps · Fessiers · Ischios · Lombaires",couleur:"#2e7d52",light:"#e6f4ec",warmup:["Tours de hanches × 15 (chaque sens)","Fentes latérales lentes × 10","Pont fessier au sol × 20","Genoux poitrine allongé × 10"],exercices:[{nom:"Squat avec kit SmartWorkout",materiel:"Kit SmartWorkout (barre + élastiques)",muscles:"Quadriceps, fessiers, ischios",posture:"Barre SmartWorkout sur les épaules, élastiques sous les pieds. Pieds largeur épaules, orteils légèrement ouverts. Descendre cuisses parallèles au sol, DOS NEUTRE obligatoire.",series:4,reps:"10-12",repos:"90s"},{nom:"Fentes avant SmartWorkout",materiel:"Kit SmartWorkout (barre + élastiques)",muscles:"Quadriceps, fessiers, ischios",posture:"Barre sur les épaules, élastiques sous le pied avant. Genou arrière effleure le sol, genou avant ne dépasse pas le bout du pied. Buste droit.",series:3,reps:"10 par jambe",repos:"90s"},{nom:"Pont fessier unilatéral",materiel:"Sol",muscles:"Fessiers, ischios, lombaires en douceur",posture:"Allongé sur le dos, une jambe fléchie pied à plat, l'autre tendue vers le plafond. Pousser les hanches vers le haut, serrer les fessiers 2 sec. Alterner les jambes.",series:4,reps:"12 par jambe",repos:"60s"},{nom:"Gainage planche avant",materiel:"Sol",muscles:"Transverse, obliques, érecteurs du rachis",posture:"Avant-bras au sol, corps aligné tête-talons. Abdos contractés, dos plat. Viser 3×45s avec forme parfaite.",series:3,reps:"45 secondes",repos:"60s"},{nom:"Dead bug",materiel:"Sol",muscles:"Core profond, stabilisateurs lombaires",posture:"Sur le dos, bras tendus vers le plafond, genoux à 90°. Descendre bras droit + jambe gauche simultanément près du sol en expirant. Dos plat PENDANT TOUT LE MOUVEMENT.",series:3,reps:"8 par côté",repos:"60s"}]},{id:"C",jour:"JEUDI",titre:"Haut du corps — Tirage",focus:"Dorsaux · Biceps · Rhomboïdes · Trapèzes",couleur:"#5a2d82",light:"#f0e8fa",warmup:["Rotations d'épaules vers l'arrière × 15","Ouvertures de bras (eagle stretch) × 10 — bras tendus devant, ouvrir grand vers l'arrière en sortant la poitrine","Suspension passive à la barre 20 secondes","Face pull élastique léger × 15"],exercices:[{nom:"Tractions assistées élastique",materiel:"Barre Eric Flag 2.0 + élastique bleu/blanc (25-65 kg)",muscles:"Grand dorsal, biceps, rhomboïdes",posture:"Prise pronation, légèrement plus large que les épaules. Élastique passé sous les genoux pour alléger. Tirer en ramenant les coudes vers les hanches, poitrine vers la barre. Contrôler la descente 3 sec.",series:4,reps:"6-8",repos:"120s"},{nom:"Rowing aux anneaux",materiel:"Anneaux de gymnastique bois",muscles:"Dorsaux, biceps, rhomboïdes, arrière épaules",posture:"Anneaux réglés à hauteur de poitrine, corps incliné à ~45°. Tirer les anneaux vers la poitrine, coudes vers les hanches. Corps rigide. Commencer à 45°.",series:4,reps:"10-12",repos:"75s"},{nom:"Face pull élastique",materiel:"Élastique Eric Flag rouge/noir fixé à la barre",muscles:"Trapèzes, deltoïdes postérieurs, rotateurs externes",posture:"Debout légèrement en retrait de la barre, tirer l'élastique vers le visage en écartant les coudes en W. Essentiel pour la santé des épaules.",series:3,reps:"15",repos:"60s"},{nom:"Rowing haltère unilatéral",materiel:"1 haltère 10 kg + appui chaise",muscles:"Grand dorsal, biceps, trapèze moyen",posture:"Genou et main d'appui sur la chaise, dos parallèle au sol et NEUTRE. Tirer l'haltère vers la hanche. Coude rasant le corps. Contrôler la descente 2 sec.",series:3,reps:"10-12 par bras",repos:"75s"},{nom:"Curl biceps haltères",materiel:"2 haltères 10 kg",muscles:"Biceps, brachial antérieur",posture:"Debout, coudes collés au corps. Monter en supination, contrôler la descente 3 sec. Ne pas balancer le buste.",series:3,reps:"10-12",repos:"60s"}]},{id:"D",jour:"SAMEDI",titre:"Full Body — Fonctionnel",focus:"Corps entier · Enchaînements · Endurance",couleur:"#8b3a1a",light:"#faeae6",warmup:["Jumping jacks × 30 secondes","Course sur place × 30 secondes","Squats à vide × 15","Rotations complètes des bras × 10"],exercices:[{nom:"Squat goblet haltère",materiel:"1 haltère 10 kg tenu à deux mains",muscles:"Quadriceps, fessiers, ischios",posture:"Haltère tenu verticalement contre la poitrine. Pieds largeur épaules, DOS NEUTRE. Descendre cuisses parallèles au sol.",series:3,reps:"12",repos:"75s"},{nom:"Pompes + rotation T",materiel:"Sol",muscles:"Pectoraux, épaules, obliques, stabilisateurs",posture:"Après chaque pompe, rotation du buste et lever un bras vers le plafond. Alterner droite-gauche. Core très engagé.",series:3,reps:"6 de chaque côté",repos:"75s"},{nom:"Tractions prise supination (chin-up)",materiel:"Barre Eric Flag 2.0",muscles:"Biceps, grand dorsal",posture:"Prise en supination (paumes vers soi), largeur d'épaules. Tirer en cherchant à amener le menton au-dessus de la barre. Descente contrôlée 3 sec.",series:3,reps:"Max propre (min. 3)",repos:"120s"},{nom:"Leg curl debout SmartWorkout",materiel:"Kit SmartWorkout (élastique fixé bas)",muscles:"Ischios, fessiers",posture:"Debout face à l'ancrage, élastique fixé à la cheville. Fléchir le genou en amenant le talon vers les fessiers. Hanche stable. Alterner les jambes.",series:3,reps:"12 par jambe",repos:"60s"},{nom:"Planche complexe",materiel:"Sol",muscles:"Core complet, lombaires, obliques",posture:"30s planche avant → 20s planche latérale droite → 20s planche latérale gauche, sans pause. Hanches alignées.",series:3,reps:"1 tour (70 sec)",repos:"75s"}]}];

const SEANCES_M2=[{id:"A",jour:"LUNDI",titre:"Haut du corps — Poussée (Intensifié)",focus:"Pectoraux · Épaules · Triceps · Plus de charge",couleur:"#1a3a5c",light:"#e8f0fa",warmup:["Rotations d'épaules × 15","Face pull élastique léger × 15","Pompes genoux lentes × 10","Mobilisation thoracique × 10"],exercices:[{nom:"Pompes pieds surélevés (déclinées)",materiel:"Sol + chaise (30-40 cm)",muscles:"Pectoraux supérieurs, triceps, avant épaules",posture:"Pieds sur la chaise, mains au sol largeur épaules. Corps aligné. Descendre la poitrine entre les mains lentement (3 sec).",series:4,reps:"8-10",repos:"90s"},{nom:"Dips lestés ou volume augmenté",materiel:"Barre dips Eric Flag",muscles:"Triceps, bas pectoraux, épaules",posture:"Si 10 dips propres sont faciles : ajouter un sac à dos lesté ou viser 4×10. Inclinaison légère vers l'avant, descente contrôlée à 90°.",series:4,reps:"8-10",repos:"90s"},{nom:"Développé épaules haltères assis",materiel:"2 haltères 10 kg",muscles:"Deltoïdes, trapèzes, triceps",posture:"Assis sur une chaise, dos appuyé, haltères à hauteur des oreilles. Pousser verticalement. Contrôler la descente 3 sec. Ne pas cambrer le dos.",series:4,reps:"10",repos:"90s"},{nom:"Pompes avec élastique résistant",materiel:"Élastique Eric Flag rouge/noir dans le dos",muscles:"Pectoraux, triceps, épaules",posture:"Passer l'élastique dans le dos sous les aisselles, tenir les extrémités dans les paumes. La résistance augmente à l'extension. Corps aligné.",series:3,reps:"8",repos:"90s"},{nom:"Élévations latérales + frontales alternées",materiel:"2 haltères 10 kg",muscles:"Deltoïdes antérieurs et latéraux",posture:"Debout : alterner élévation frontale bras droit et élévation latérale bras gauche. Légère flexion des coudes. Contrôle total, pas d'élan.",series:3,reps:"10 par côté",repos:"60s"}]},{id:"B",jour:"MARDI",titre:"Bas du corps + Core (Progression)",focus:"Plus de charge · Unilatéral · Gainage dynamique",couleur:"#2e7d52",light:"#e6f4ec",warmup:["Tours de hanches × 20","Fentes latérales lentes × 12","Pont fessier × 20","Bird-dog × 10 par côté"],exercices:[{nom:"Squat bulgare SmartWorkout",materiel:"Kit SmartWorkout + chaise",muscles:"Quadriceps, fessiers, ischios",posture:"Pied arrière sur la chaise, pied avant à 60 cm. Barre SmartWorkout sur les épaules, élastiques sous le pied avant. Descendre le genou arrière vers le sol. Buste droit.",series:4,reps:"8 par jambe",repos:"90s"},{nom:"Romanian deadlift haltères (RDL)",materiel:"2 haltères 10 kg",muscles:"Ischios, fessiers, érecteurs du rachis",posture:"Debout, haltères devant les cuisses, légère flexion des genoux. Incliner le buste, DOS ABSOLUMENT NEUTRE. Revenir en contractant les fessiers. Ne jamais arrondir le dos.",series:4,reps:"10-12",repos:"90s"},{nom:"Pont fessier unilatéral lesté",materiel:"1 haltère 10 kg + Sol",muscles:"Fessiers, ischios",posture:"Allongé sur le dos, une jambe fléchie, l'autre tendue. Haltère posé sur le bassin (t-shirt plié en coussin). Pousser les hanches vers le haut, serrer les fessiers 2 sec.",series:4,reps:"10 par jambe",repos:"75s"},{nom:"Planche avec toucher d'épaule",materiel:"Sol",muscles:"Core, anti-rotation, stabilisateurs lombaires",posture:"Planche sur les mains (bras tendus). Toucher l'épaule opposée avec la main sans bouger les hanches. Très lent et contrôlé.",series:3,reps:"10 par côté",repos:"60s"},{nom:"Pallof press élastique",materiel:"Élastique Eric Flag rouge/noir (ancrage latéral à la barre)",muscles:"Core, anti-rotation, transverse",posture:"Debout de côté par rapport à l'ancrage, tenir l'élastique à deux mains à hauteur du sternum. Tendre les bras devant soi et revenir LENTEMENT.",series:3,reps:"10 par côté",repos:"60s"}]},{id:"C",jour:"JEUDI",titre:"Haut du corps — Tirage (Progression)",focus:"Dorsaux · Biceps · Volume augmenté",couleur:"#5a2d82",light:"#f0e8fa",warmup:["Suspension passive barre 20 sec","Scapular pulls (rétractions omoplates) × 10","Face pull élastique × 15","Flexions-extensions libres des coudes × 15"],exercices:[{nom:"Tractions sans assistance (ou réduite)",materiel:"Barre Eric Flag 2.0 + élastique bleu/jaune si besoin (12-32 kg)",muscles:"Grand dorsal, biceps, rhomboïdes",posture:"Tenter sans élastique. Si 5+ tractions propres → 4×5 sans aide puis finir avec élastique léger. Négatifs : monter avec élan, descendre en 5 sec.",series:4,reps:"5-8",repos:"120s"},{nom:"Rowing anneaux (plus horizontal)",materiel:"Anneaux de gymnastique bois",muscles:"Dorsaux, biceps, rhomboïdes, arrière épaules",posture:"Corps plus incliné (viser 20-30° du sol). Tirer les anneaux vers la poitrine, rotation naturelle des anneaux vers l'extérieur en haut. Corps rigide.",series:4,reps:"10-12",repos:"75s"},{nom:"Rowing haltère + squeeze omoplate",materiel:"1 haltère 10 kg + chaise",muscles:"Grand dorsal, rhomboïdes, trapèze moyen",posture:"Même technique qu'au mois 1 + pause 2 sec en haut en serrant fort l'omoplate. Augmente le recrutement sans ajouter de charge.",series:4,reps:"10 par bras",repos:"75s"},{nom:"Curl marteau haltères",materiel:"2 haltères 10 kg",muscles:"Brachial, biceps, avant-bras",posture:"Prise neutre (pouces vers le haut). Monter les haltères, coudes fixes le long du corps. Contrôler la descente 3 sec.",series:3,reps:"12",repos:"60s"},{nom:"Face pull W to Y",materiel:"Élastique Eric Flag bleu/jaune fixé à la barre",muscles:"Trapèzes, rhomboïdes, rotateurs externes",posture:"Tirer en W (coudes haut, mains vers le visage) puis ouvrir en Y (bras tendus en diagonale vers le haut). Contrôle total.",series:3,reps:"12",repos:"60s"}]},{id:"D",jour:"SAMEDI",titre:"Full Body — Force & Densité",focus:"Corps entier · Super-sets · Moins de repos",couleur:"#8b3a1a",light:"#faeae6",warmup:["Jumping jacks × 45 secondes","Burpees modifiés sans saut × 8","Squats à vide × 20","Rotations bras tendus × 15"],exercices:[{nom:"Super-set : Squat SmartWorkout + Rowing anneaux",materiel:"Kit SmartWorkout + Anneaux bois",muscles:"Jambes + dos",posture:"Enchaîner sans repos : 10 squats SmartWorkout → 10 rowings aux anneaux. Repos 90s entre les super-sets.",series:4,reps:"10 + 10",repos:"90s"},{nom:"Super-set : Pompes déclinées + Face pull",materiel:"Chaise + Élastique rouge/noir",muscles:"Pectoraux + arrière épaules",posture:"10 pompes pieds surélevés → 15 face pulls sans repos. Tandem poussée/tirage protège l'épaule.",series:3,reps:"10 + 15",repos:"75s"},{nom:"Tractions max + fente SmartWorkout",materiel:"Barre Eric Flag 2.0 + Kit SmartWorkout",muscles:"Corps entier",posture:"Max de tractions propres → directement 10 fentes par jambe avec barre SmartWorkout. Repos 120s.",series:3,reps:"Max + 10 fentes",repos:"120s"},{nom:"Pont fessier unilatéral",materiel:"Sol",muscles:"Fessiers, ischios",posture:"Allongé sur le dos, une jambe fléchie, l'autre tendue vers le plafond. Pousser les hanches vers le haut, serrer les fessiers 2 sec en haut. Alterner.",series:3,reps:"12 par jambe",repos:"75s"},{nom:"Gainage complexe final",materiel:"Sol",muscles:"Core complet",posture:"40s planche avant → 25s planche latérale droite → 25s planche latérale gauche → retour 20s planche avant. Enchaîner sans pause.",series:3,reps:"1 tour (110 sec)",repos:"90s"}]}];

const SEANCES_M3=[{id:"A",jour:"LUNDI",titre:"Haut du corps — Poussée Avancée",focus:"Pectoraux · Épaules · Triceps · Station Eric Flag",couleur:"#1a3a5c",light:"#e8f0fa",warmup:["Face pull élastique léger × 20","Rotations d'épaules × 15 (chaque sens)","Pompes pike × 10","Mobilisation thoracique × 10"],exercices:[{nom:"Pompes aux anneaux",materiel:"Anneaux de gymnastique bois",muscles:"Pectoraux, triceps, stabilisateurs profonds",posture:"Anneaux réglés à 20-30 cm du sol, mains dans les anneaux. Corps aligné tête-talons. Descendre en contrôlant les anneaux (tendance à s'écarter — résiste). Instabilité = recrutement musculaire bien supérieur aux pompes classiques.",series:4,reps:"8-10",repos:"90s"},{nom:"Dips lestés à la barre Eric Flag",materiel:"Barre dips Eric Flag + sac à dos lesté",muscles:"Triceps, bas pectoraux, épaules",posture:"Sac à dos avec 3-5 kg sur le dos. Même technique : inclinaison légère vers l'avant, descente contrôlée à 90°. Tu maîtrises 10 dips propres → il est temps de lester.",series:4,reps:"8",repos:"90s"},{nom:"Développé militaire strict élastique",materiel:"Élastique Eric Flag bleu/jaune (12-32 kg)",muscles:"Deltoïdes, trapèzes, triceps",posture:"Debout, deux pieds sur l'élastique, poignées à hauteur des épaules. Pousser verticalement bras tendus, descendre lentement 3 sec. Plus de résistance qu'au rouge/noir du mois 1.",series:4,reps:"10",repos:"90s"},{nom:"Pike push-up pieds surélevés",materiel:"Chaise + Sol",muscles:"Deltoïdes, triceps",posture:"Pieds sur la chaise, position en V inversé très prononcé. Descendre la tête vers le sol entre les mains. Simule un développé épaules avec le poids du corps. Excellent sur la station Eric Flag.",series:3,reps:"8-10",repos:"75s"},{nom:"Élévations latérales élastique (tension constante)",materiel:"Élastique Eric Flag rouge/noir",muscles:"Deltoïdes latéraux",posture:"Un pied sur l'élastique, lever le bras latéralement à l'horizontale contre la résistance. L'élastique maintient une tension constante contrairement aux haltères. 12 reps par bras.",series:3,reps:"12 par bras",repos:"60s"}]},{id:"B",jour:"MARDI",titre:"Haut du corps — Tirage Avancé",focus:"Dorsaux · Biceps · Anneaux · Station Eric Flag",couleur:"#5a2d82",light:"#f0e8fa",warmup:["Suspension passive barre 30 sec","Scapular pulls × 12","Face pull W to Y × 15","Rotations externes élastique léger × 15"],exercices:[{nom:"Tractions pronation — volume",materiel:"Barre Eric Flag 2.0",muscles:"Grand dorsal, biceps, rhomboïdes",posture:"Sans assistance. Prise pronation légèrement plus large que les épaules. Tu progresses bien → viser 4×6-8 reps propres. Descente contrôlée 4 sec (négatif lent = hypertrophie ++). Si fatigue : finir avec élastique bleu/jaune.",series:4,reps:"6-8",repos:"120s"},{nom:"Tractions prise neutre (anneaux)",materiel:"Anneaux de gymnastique bois",muscles:"Grand dorsal, biceps, brachial, rhomboïdes",posture:"Anneaux réglés en hauteur, prise neutre (paumes face à face). Tirer en amenant la poitrine vers les anneaux. Rotation naturelle des poignets autorisée. Cible différemment les dorsaux vs la barre.",series:3,reps:"6-8",repos:"120s"},{nom:"Rowing anneaux horizontal",materiel:"Anneaux de gymnastique bois",muscles:"Dorsaux, rhomboïdes, arrière épaules",posture:"Corps quasi horizontal (talons au sol, corps à 15-20° du sol). Tirer les anneaux vers la poitrine, coudes le long du corps. Le plus difficile de la série anneaux.",series:4,reps:"10-12",repos:"75s"},{nom:"Curl biceps élastique (tension constante)",materiel:"Élastique Eric Flag rouge/noir",muscles:"Biceps, brachial antérieur",posture:"Debout, un pied sur l'élastique. Curl des deux bras simultanément. L'élastique maintient la tension en bas (contrairement aux haltères qui déchargent). Coudes fixes le long du corps.",series:3,reps:"12-15",repos:"60s"},{nom:"Face pull + rotation externe élastique",materiel:"Élastique Eric Flag bleu/jaune fixé à la barre Eric Flag",muscles:"Trapèzes, rotateurs externes, deltoïdes postérieurs",posture:"Face pull classique en W, puis en position haute, faire une rotation externe des avant-bras (pointer les mains vers le plafond). Excellent pour la santé des épaules à ce stade d'entraînement.",series:3,reps:"12",repos:"60s"}]},{id:"C",jour:"JEUDI",titre:"Haut du corps — Force & Anneaux",focus:"80% haut · 20% bas · Mouvements composés",couleur:"#1a5c4a",light:"#e6f4f0",warmup:["Jumping jacks × 30 sec","Rotations complètes bras × 15","Pompes pike × 10","Suspension passive × 20 sec"],exercices:[{nom:"Super-set : Tractions + Dips (push-pull)",materiel:"Barre Eric Flag 2.0 + Barre dips Eric Flag",muscles:"Corps entier haut — antagonistes",posture:"Enchaîner sans repos : max tractions propres → max dips propres. C'est le super-set ultime sur la station Eric Flag. Repos 2 min entre les tours. Fatigue musculaire très élevée.",series:4,reps:"Max + Max",repos:"120s"},{nom:"Pompes archer (unilatéral progressif)",materiel:"Sol",muscles:"Pectoraux, triceps, épaules (côté actif ++)",posture:"Position de pompe large. Descendre en décalant le poids vers un bras (le bras opposé reste tendu en appui). Alterner. Transition vers la pompe à un bras. Demande un grand contrôle.",series:3,reps:"6 par côté",repos:"90s"},{nom:"Rowing anneaux supination",materiel:"Anneaux de gymnastique bois",muscles:"Biceps, dorsaux, rhomboïdes",posture:"Prise supination (paumes vers le haut) sur les anneaux, corps incliné à 30-45°. Tirer vers la poitrine. La supination charge davantage les biceps.",series:3,reps:"10-12",repos:"75s"},{nom:"Squat bulgare SmartWorkout",materiel:"Kit SmartWorkout + chaise",muscles:"Quadriceps, fessiers (20% bas du corps)",posture:"Pied arrière sur la chaise, barre SmartWorkout sur les épaules. Descendre le genou arrière vers le sol. DOS NEUTRE. C'est le seul exercice bas du corps de la séance — le faire sérieusement.",series:3,reps:"10 par jambe",repos:"90s"},{nom:"L-sit tuck aux anneaux",materiel:"Anneaux de gymnastique bois",muscles:"Core, psoas, triceps, dorsaux",posture:"Suspen                       const val=getVal(suiviSemaine,sid,ei,si);
                      return React.createElement("div",{key:si,style:{background:val.done?cc.bg:"white",border:`1px solid ${cc.bg}`,borderRadius:6,padding:"4px 6px",minWidth:52,transition:"all 0.15s"}},
                        React.createElement("div",{onClick:()=>setVal(suiviSemaine,sid,ei,si,{done:!val.done}),style:{fontSize:10,fontWeight:700,color:val.done?"white":cc.bg,textAlign:"center",marginBottom:3,cursor:"pointer"}},`${val.done?"✓":"○"} S${si+1}`),
                        React.createElement("input",{value:val.reps,onChange:e=>setVal(suiviSemaine,sid,ei,si,{reps:e.target.value}),placeholder:ex.reps,style:{width:"100%",border:"none",background:"transparent",fontSize:10,color:val.done?"white":"#555",textAlign:"center",outline:"none"}}),
                        React.createElement("div",{style:{display:"flex",justifyContent:"center",gap:2,marginTop:2}},
                          ["😓","💪","🔥"].map((em,ri)=>React.createElement("span",{key:ri,onClick:()=>setVal(suiviSemaine,sid,ei,si,{ressenti:ri+1}),style:{fontSize:10,opacity:val.ressenti===ri+1?1:0.3,cursor:"pointer"}},em))
                        )
                      );
                    })
                  )
                )
              )
            );
          });
        })()
      ),
      React.createElement("div",{style:{background:"white",borderRadius:12,border:"1px solid #e8e8e0",padding:14}},
        React.createElement("div",{style:{fontSize:11,fontWeight:800,color:"#555",textTransform:"uppercase",letterSpacing:1,marginBottom:10}},"Vue globale — 12 semaines"),
        React.createElement("div",{style:{overflowX:"auto"}},
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"auto 1fr 1fr 1fr 1fr 0.7fr",gap:3,minWidth:280}},
            React.createElement("div",{style:{fontSize:9,color:"#aaa"}},""),
            ...["Lun","Mar","Jeu","Sam","Libre"].map((j,i)=>React.createElement("div",{key:j,style:{fontSize:9,fontWeight:700,color:"#888",textAlign:"center",display:i===4?"none":"block"}},j)),
            React.createElement("div",{style:{fontSize:9,fontWeight:700,color:"#2c6e8a",textAlign:"center"}},"Abs"),
            ...Array.from({length:totalWeeks},(_,wi)=>{
              const s=wi+1;
              const sids=getSemIds(s);
              const cells=["A","B","C","D","E"].map(sid=>{
                if(!sids.includes(sid))return React.createElement("div",{key:sid,style:{height:22,borderRadius:4,background:"#f0f0eb",opacity:0.2}});
                const p=pct(s,sid);const cc=COULEURS[sid];
                return React.createElement("div",{key:sid,onClick:()=>setSuiviSemaine(s),style:{height:22,borderRadius:4,cursor:"pointer",background:p===0?"#f0f0eb":p===100?"#2e7d52":cc.bg,opacity:p===0?0.4:1,display:"flex",alignItems:"center",justifyContent:"center"}},
                  React.createElement("span",{style:{fontSize:8,color:p===0?"#aaa":"white",fontWeight:700}},p===100?"✓":p>0?`${p}%`:"—")
                );
              });
              return [React.createElement("div",{key:`s${s}`,style:{fontSize:9,fontWeight:700,color:"#555",display:"flex",alignItems:"center"}},`S${s}`),...cells];
            }).flat()
          )
        ),
        React.createElement("div",{style:{display:"flex",gap:10,marginTop:10,flexWrap:"wrap"}},
          [["#f0f0eb","Non fait"],["#4a9fd4","En cours"],["#2e7d52","Terminé"]].map(([color,label])=>
            React.createElement("div",{key:label,style:{display:"flex",alignItems:"center",gap:4}},
              React.createElement("div",{style:{width:10,height:10,borderRadius:3,background:color}}),
              React.createElement("span",{style:{fontSize:10,color:"#888"}},label)
            )
          )
        )
      )
    ),

    vue==="conseils"&&React.createElement("div",{style:{maxWidth:700,margin:"0 auto",padding:"14px 14px 40px"}},
      React.createElement("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a1a",marginBottom:3}},"Conseils & Références"),
      React.createElement("div",{style:{fontSize:11,color:"#888",marginBottom:14}},"Tout ce qu'il faut savoir pour progresser intelligemment."),
      TIPS.map((t,i)=>React.createElement("div",{key:i,style:{background:"white",borderRadius:10,padding:"12px 14px",marginBottom:8,border:"1px solid #e8e8e0",display:"flex",gap:12}},
        React.createElement("div",{style:{fontSize:20,flexShrink:0}},t.icon),
        React.createElement("div",null,
          React.createElement("div",{style:{fontSize:13,fontWeight:700,color:"#1a1a1a",marginBottom:3}},t.titre),
          React.createElement("div",{style:{fontSize:12,color:"#555",lineHeight:1.5}},t.texte)
        )
      )),
      React.createElement("div",{style:{background:"white",borderRadius:10,padding:14,border:"1px solid #e8e8e0",marginTop:4}},
        React.createElement("div",{style:{fontSize:11,fontWeight:800,color:"#555",textTransform:"uppercase",letterSpacing:1,marginBottom:10}},"📊 Objectifs à 12 semaines"),
        [{label:"Tractions",depart:"5 reps",objectif:"10+ reps sans assistance"},{label:"Dips",depart:"10 reps",objectif:"Dips lestés 5 kg"},{label:"Pompes",depart:"25 reps",objectif:"Pompes aux anneaux 4×10"},{label:"Planche",depart:"1 min",objectif:"RKC 30 sec = planche 90 sec"}].map((o,i)=>
          React.createElement("div",{key:i,style:{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:i<3?"1px solid #f0f0eb":"none",alignItems:"center"}},
            React.createElement("span",{style:{fontSize:12,fontWeight:700,color:"#333",width:"30%"}},o.label),
            React.createElement("span",{style:{fontSize:11,color:"#888"}},o.depart),
            React.createElement("span",{style:{fontSize:11,color:"#888"}},"→"),
            React.createElement("span",{style:{fontSize:11,color:"#2e7d52",fontWeight:700,textAlign:"right",width:"45%"}},o.objectif)
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
